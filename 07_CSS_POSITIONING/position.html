<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
   
        .parent{
            border: 2px solid black;
            width: 1000vw;
            height: 800vh;
            position: relative;
            /* transform filter and perspective property also make ans element appear positioned */
           

        }
        .box{
           
            margin: 3px;
            padding: 3px;
            height: 130px;
            width: 80vw;
            border: 2px solid black;
        }
        .box1{
            position: absolute;
            top: 0px;
           
            background-color: red;
        
            /* position: absolute; */

            
        }
        .box2{
            background-color: aqua;
        }
        .box3{
            background-color: rgb(12, 146, 102);
        }
    </style>
</head>
<body>
    <div class="parent">

        <div class="box box1" ></div>
        <div class="box box2"></div>
        <div class="box box3"></div>

    </div>
</body>
</html>
