<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA_EDIT</title>
    <style>
        :root {
            --main-color: rgb(247, 201, 53);
            --text-color: white;
            box-sizing: border-box;
        }


        * {
            font-family: 'Courier New', Courier, monospace;
        }

        nav {
            margin: 20px;
            /* height: 100px; */
            padding: 20px;
            background-color: white;
            display: flex;
            align-items: center;
            border: 1px solid grey;
        }

        div img {
            margin-left: 20px;
            width: 150px;
            height: 50px;


        }

        ul {
            display: flex;
            /* text-decoration: none; */
            list-style: none;
            gap: 20px;
            margin: 0 auto;

        }

        a {
            text-decoration: none;
            color: black;
        }

        .button button {
            width: 90px;
            height: 40px;
            background-color: rgb(247, 201, 53);
            border: none;
            border-radius: 6px;
        }

        .button {
            display: flex;
            align-items: center;
            margin-right: 10px;
            gap: 10px;
        }

        .english:hover{
           
             color: var(--main-color);
        }

        .container {

            display: flex;
            margin-top: 50px;
        }

        .right-side {

            padding: 10px 40px;

            flex: 1;
        }

        .left-side {
            flex: 1;

        }

        .phone img {
            width: 580px;
            height: 400px;
            border-radius: 20px;
            margin-right: 50px;


        }

        .right-side h1 {

            font-size: 50px;
            font-weight: bold;
            color: rgb(41, 40, 40);
        }

        .right-side p {

            color: rgb(41, 40, 40);
        }

        .button-both {
            display: flex;
            margin-top: 30px;
            height: 40px;
            gap: 20px;


        }

        .button1 {
            background-color: var(--main-color);
            border: none;
            border-radius: 4px;
        }

        .button2 {
            border: none;
            border-radius: 4px;
            width: 150px;
        }

        .button1:hover,
        .download:hover {
            background-color: rgb(220, 175, 30);
            /* A slightly darker yellow */
            transform: scale(1.05);
            /* Makes the button pop out slightly */
        }

        /* 3. Hover effect for your transparent buttons (.button2 and .english) */
        .button2:hover,
        .english:hover {
            background-color: #f0f0f0;
            /* Adds a light grey background */
        }
    </style>
</head>

<body>

    <nav>
        <div>
            <img src="images.jpeg" alt="">
        </div>
        <ul>
            <li><a href="#">product</a></li>
            <li><a href="#">buy</a></li>
            <li><a href="#">renew</a></li>
            <li><a href="#">support</a></li>
            <li><a href="#">leanrn</a></li>
            <li><a href="#">company</a></li>
        </ul>

        <div class="button">

            <button class="download">
                Download
            </button>
            <button class="english" style="background-color: transparent;
            ">
                English
            </button>
            <div> 🔍︎</div>
        </div>
    </nav>

    <div class="container">


        <div class="right-side">

            <h1>Text editor for your most critical work.</h1>
            <p>Data professionals and IT teams choose UltraEdit for stronger security standards, unmatched performance
                with large files, and fast dedicated support when issues arise. </p>
            <div class="button-both">
                <button class="button1"> Try ultra Edit</button>
                <button class="button2"> View Plan </button>
            </div>

        </div>


        <div class="left-side">

            <div class="phone">
                <img src="phone.png" alt="">
            </div>

        </div>
    </div>
</body>

</html>
