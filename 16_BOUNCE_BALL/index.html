<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce ball</title>
    <style>
        .container{
            width: 80vw;
            height: 60vh;
            background-color: red;
            position: relative;
        }
        .box{
            left: 0;
            bottom: 0;
            position: absolute;
            background-color: blueviolet;
            width: 100px;
            height: 100px;
            border-radius: 80px;
            animation: 
                     animateX 3s  linear infinite   ,
                      animateY 1s  ease-out infinite alternate ;
        }
        @keyframes animateX {
            from {
                left: 0;
            }
            to{
                left: 80%;
            }
            
        }
        @keyframes animateY {
            from {
                bottom: 0;
            }
            to{
                bottom: 80%;
            }
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
</body>
</html>
